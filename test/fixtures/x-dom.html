<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-to-claude DOM fixture</title>
  <!-- A hand-written fixture mimicking X's post DOM (data-testids and nesting), for trying
       extract.js and content.js in a browser. chrome.runtime is stubbed. -->
  <link rel="stylesheet" href="../../extension/content.css">
  <style>
    body { font: 15px -apple-system, sans-serif; margin: 0; background: rgb(255, 255, 255); color: #0f1419; }
    body.dark { background: rgb(0, 0, 0); color: #e7e9ea; }
    main { max-width: 600px; margin: 0 auto; border-inline: 1px solid #eff3f4; }
    article { padding: 12px 16px; border-bottom: 1px solid #eff3f4; cursor: pointer; }
    [data-testid="User-Name"] { display: flex; gap: 4px; }
    [data-testid="User-Name"] > div { display: flex; gap: 4px; }
    [data-testid="tweetText"] { white-space: pre-wrap; margin: 4px 0 8px; }
    [role="group"] { display: flex; justify-content: space-between; max-width: 425px; margin-top: 8px; }
    [role="group"] button { all: unset; width: 34.75px; height: 34.75px; text-align: center; color: rgb(113, 118, 123); }
    div[role="link"] { border: 1px solid #cfd9de; border-radius: 16px; padding: 12px; margin: 8px 0; }
    .hidden { display: none; }
    a { color: #1d9bf0; text-decoration: none; }
    [data-testid="tweetPhoto"] img { max-width: 100%; height: 120px; background: #eee; display: block; }
  </style>
</head>
<body>
<main>
  <!-- 1: emoji, hashtag, shortened t.co link, photo, card -->
  <article data-testid="tweet" role="article" id="t1">
    <div data-testid="User-Name">
      <div><a href="/janedoe" role="link"><span>Jane Doe <img alt="⚖️" src="data:," width="1"></span></a></div>
      <div><a href="/janedoe" role="link"><span>@janedoe</span></a><span>·</span><a href="/janedoe/status/1844000000000000001" role="link"><time datetime="2026-10-04T09:15:00.000Z">Oct 4</time></a></div>
    </div>
    <div data-testid="tweetText" lang="en"><span>A short note on AI and </span><a href="/hashtag/law">#law</a><span> today </span><img alt="🔥" src="data:," width="1"><span>
Second line: </span><a href="https://t.co/AbCdEf"><span class="hidden">https://</span>example.com/legal-ai-rap<span class="hidden">or</span><span aria-hidden="true">…</span></a></div>
    <div data-testid="tweetPhoto"><img alt="Image" src="https://pbs.twimg.com/media/ABC123?format=jpg&amp;name=small"></div>
    <div data-testid="card.wrapper"><a href="https://t.co/CARD01">example.com · Report</a></div>
    <div role="group" aria-label="Actions">
      <div><button data-testid="reply" aria-label="Reply">💬</button></div>
      <div><button data-testid="retweet" aria-label="Repost">🔁</button></div>
      <div><button data-testid="like" aria-label="Like">♡</button></div>
      <div><a href="/janedoe/status/1844000000000000001/analytics">📊</a></div>
      <div style="display:flex"><div><button data-testid="bookmark" aria-label="Bookmark">🔖</button></div><div><button aria-label="Share">⤴</button></div></div>
    </div>
  </article>

  <!-- 2: a quoted post (timestamp without a link, with its own photo) -->
  <article data-testid="tweet" role="article" id="t2">
    <div data-testid="User-Name">
      <div><a href="/researcher" role="link"><span>Researcher</span></a></div>
      <div><a href="/researcher" role="link"><span>@researcher</span></a><span>·</span><a href="/researcher/status/1844000000000000002" role="link"><time datetime="2026-10-05T07:00:00.000Z">Oct 5</time></a></div>
    </div>
    <div data-testid="tweetText" lang="en"><span>I agree with </span><a href="/janedoe">@janedoe</a></div>
    <div role="link" tabindex="0">
      <div data-testid="User-Name">
        <div><span>Other Person</span></div>
        <div><span>@other</span><span>·</span><time datetime="2026-10-03T12:00:00.000Z">Oct 3</time></div>
      </div>
      <div data-testid="tweetText" lang="en"><span>The quoted content is here.</span></div>
      <div data-testid="tweetPhoto"><img alt="Quoted image" src="https://pbs.twimg.com/media/QQQ999?format=png&amp;name=small"></div>
    </div>
    <div role="group" aria-label="Actions">
      <div><button data-testid="reply">💬</button></div>
      <div><button data-testid="retweet">🔁</button></div>
      <div><button data-testid="like">♡</button></div>
      <div><a href="#">📊</a></div>
      <div style="display:flex"><div><button data-testid="removeBookmark">🔖</button></div><div><button>⤴</button></div></div>
    </div>
  </article>

  <!-- 3: long truncated text, video poster -->
  <article data-testid="tweet" role="article" id="t3">
    <div data-testid="User-Name">
      <div><a href="/longwriter" role="link"><span>Long Writer</span></a></div>
      <div><a href="/longwriter" role="link"><span>@longwriter</span></a><span>·</span><a href="/longwriter/status/1844000000000000003" role="link"><time datetime="2026-10-05T08:30:00.000Z">Oct 5</time></a></div>
    </div>
    <div data-testid="tweetText" lang="en"><span>The start of a very long text…</span></div>
    <button data-testid="tweet-text-show-more-link">Show more</button>
    <div data-testid="tweetPhoto"><video poster="https://pbs.twimg.com/ext_tw_video_thumb/777/pu/img/poster.jpg"></video></div>
    <div role="group" aria-label="Actions">
      <div><button data-testid="reply">💬</button></div>
      <div><button data-testid="like">♡</button></div>
      <div style="display:flex"><div><button data-testid="bookmark">🔖</button></div></div>
    </div>
  </article>

  <!-- 4: a post added later (MutationObserver) appears here -->
</main>

<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.body.classList.add('dark');
  // Clicking a post goes to its page on X; the button must stop that.
  document.addEventListener('click', (e) => {
    if (e.target.closest('article')) window.__articleClicks = (window.__articleClicks || 0) + 1;
  });
  // A stand-in for the service worker: produces relay responses and records what was sent.
  window.__mode = new URLSearchParams(location.search).get('mode') || 'ok';
  window.__sent = [];
  // mode=login: the Claude CLI login has expired. window.__finishLogin(true|false) mimics the outcome on the sign-in page.
  window.__loggedIn = window.__mode !== 'login';
  window.__loginRunning = false;
  window.__finishLogin = (ok) => {
    window.__loginRunning = false;
    window.__loggedIn = ok;
  };
  window.chrome = {
    runtime: {
      async sendMessage(msg) {
        window.__sent.push(JSON.parse(JSON.stringify(msg)));
        await new Promise((r) => setTimeout(r, 150));
        if (window.__mode === 'down') return { ok: false, kind: 'unreachable', error: 'Can\'t reach the relay. Is "npm run relay" running?' };
        if (window.__mode === 'notoken') return { ok: false, kind: 'config', error: 'The relay token isn\'t set.' };
        if (msg.type === 'claudeLoginStatus') return { ok: true, data: { loggedIn: window.__loggedIn, running: window.__loginRunning } };
        if (msg.type === 'claudeLogin') {
          window.__loginRunning = true;
          return { ok: true, data: { ok: true } };
        }
        if (msg.type === 'newSession') {
          if (!window.__loggedIn) return { ok: false, kind: 'claude-login', status: 502, error: 'Claude login expired' };
          return { ok: true, data: { ok: true, sessionId: 'abc', name: 'X: @someone' } };
        }
        if (msg.type === 'sessions') {
          return { ok: true, data: { sessions: [
            { id: 's1', name: 'my-project', cwd: '/Users/you/code/my-project', entrypoint: 'cli' },
            { id: 's2', name: 'x-to-claude', cwd: '/Users/you/code/x-to-claude', entrypoint: 'claude-desktop' },
          ] } };
        }
        if (msg.type === 'saved') return { ok: true, data: { saved: msg.ids.filter((id) => id === '1844000000000000002') } };
        if (msg.type === 'save') {
          if (window.__mode === 'noarchivist') return { ok: true, data: { id: '1', queued: true, archivist: null } };
          if (window.__mode === 'login') return { ok: true, data: { id: '1', queued: true, archivist: null, waking: true } };
          return { ok: true, data: { id: '1', archivist: 'x-archive', batched: 1 } };
        }
        if (msg.type === 'send') {
          if (window.__mode === 'error') return { ok: false, kind: 'http', status: 502, error: 'delivery failed: socket error: ECONNREFUSED' };
          return { ok: true, data: { batched: 1 } };
        }
        return { ok: true };
      },
    },
  };
</script>
<script src="../../extension/extract.js"></script>
<script src="../../extension/content.js"></script>
</body>
</html>
